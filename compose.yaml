services:
  archive:
    image: juanzhan-foundation:dev
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      JUANZHAN_DATA_DIR: /data
      JUANZHAN_SOURCE_MOUNTS: '${JUANZHAN_SOURCE_MOUNTS:-{}}'
      JUANZHAN_COOKIE_SECURE: ${JUANZHAN_COOKIE_SECURE:-true}
      JUANZHAN_UPLOAD_MAX_BYTES: ${JUANZHAN_UPLOAD_MAX_BYTES:-67108864}
      JUANZHAN_UPLOAD_TIMEOUT_SECONDS: ${JUANZHAN_UPLOAD_TIMEOUT_SECONDS:-60}
    volumes:
      - archive_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped
  archive-worker:
    image: juanzhan-foundation:dev
    command: ["python", "-m", "juanzhan.worker"]
    environment:
      JUANZHAN_DATA_DIR: /data
      CONVERTER_URL: http://converter:8000
      CONVERTER_SERVICE_TOKEN: ${CONVERTER_SERVICE_TOKEN:?Set CONVERTER_SERVICE_TOKEN}
      JUANZHAN_SOURCE_MOUNTS: '${JUANZHAN_SOURCE_MOUNTS:-{}}'
    volumes:
      - archive_data:/data
    depends_on:
      archive:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "juanzhan.worker", "--healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 10
    stop_grace_period: 10s
    restart: unless-stopped
  converter:
    image: juanzhan-foundation:dev
    build: .
    command: ["python", "-m", "uvicorn", "juanzhan.converter:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CONVERTER_SERVICE_TOKEN: ${CONVERTER_SERVICE_TOKEN:?Set CONVERTER_SERVICE_TOKEN}
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    restart: unless-stopped
volumes:
  archive_data:
