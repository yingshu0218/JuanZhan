[project]
name = "juanzhan"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "regex>=2024.11,<2027",
    "pypdf>=6,<7",
    "markdown-it-py>=4,<5",
    "defusedxml>=0.7.1,<0.8",
    "tesserocr==2.11.0",
    "pypdfium2==5.14.0",
    "pillow==13.0.0",
    "opencc-python-reimplemented==0.1.7",
    "olefile==0.47",
    "xlrd==2.0.2",
    "striprtf==0.0.33",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["services"]
testpaths = ["tests"]
