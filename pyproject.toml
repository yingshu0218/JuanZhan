[project]
name = "juanzhan"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "regex>=2024.11,<2027",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["services"]
testpaths = ["tests"]
