openapi: 3.1.0
info:
  title: Archive Document Converter (independent service)
  version: 0.4.3
  description: 不接LLM的独立文档转换服务。T20实现六格式基础解析；T21按需OCR扫描PDF及PNG/JPEG/TIFF，并生成受限PNG缩略图。Archive持久化和用户原件预览尚未接入。只在内部网络使用服务Bearer Token，不访问Archive业务数据库或来源卷。
servers:
- url: /
  description: 转换器独立容器的 HTTP 根路径
security:
- serviceToken: []
paths:
  /healthz:
    get:
      summary: 容器本地健康检查，不应经公共网关暴露
      security: []
      responses:
        '200':
          description: 运行中
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /v1/capabilities:
    get:
      summary: 格式和 OCR 能力声明
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          description: 无效 Token
        '422':
          description: 请求不合法
        '429':
          description: 处理容量不足
        '500':
          description: 服务处理错误
  /v1/jobs:
    post:
      summary: 上传文件并启动隔离的解析任务
      description: 只接受 multipart 二进制输入；拒绝客户端指定服务器文件路径或 URL；请求元数据使用 Archive 生成的 FileRevision/ParseRun ID，不授予数据库访问权限。文件大小、页数、CPU/内存/执行时限均在服务端受控。
        parse_run_id在临时spool有效期内绑定二进制SHA-256及全部选项，重复相同输入返回原任务，冲突409；清理/TTL或容器tmpfs丢失后不保证保留幂等映射。任务只尝试一次，调用者必须有限重试。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - file_revision_id
              - parse_run_id
              properties:
                file:
                  type: string
                  format: binary
                file_revision_id:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{1,128}$
                parse_run_id:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{1,128}$
                declared_mime:
                  type: string
                  maxLength: 255
                  description: 文本子类型无法仅凭字节可靠区分：对已识别文本/BOM接受text/markdown或text/html提示；PDF/ZIP等二进制签名优先，不接文件扩展路径。
                ocr_enabled:
                  type: boolean
                  default: false
                  description: 表单只接受true/false，默认false；仅无文本PDF页及图片按需OCR；引擎/模型不可用返回OCR_UNAVAILABLE或OCR_LANGUAGE_UNAVAILABLE
                ocr_languages:
                  type: string
                  description: 逗号分隔：chi_sim,eng；禁止重复且必须已在capabilities声明，启用OCR不传语言默认eng；未启用时传语言返回OCR_DISABLED
                  maxLength: 255
                generate_preview:
                  type: boolean
                  default: true
                  description: 表单只接受true/false；PDF/PNG/JPEG/TIFF生成受限PNG缩略图，按原页/帧顺序，超页数有PREVIEW_TRUNCATED；其他格式记录PREVIEW_NOT_AVAILABLE
              additionalProperties: false
      responses:
        '202':
          description: 任务已接受
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
        '401':
          description: 无效 Token
        '422':
          description: 请求不合法
        '429':
          description: 处理容量不足
        '500':
          description: 服务处理错误
        '400':
          description: 非法或不完整multipart/不接受JSON路径输入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 任务不存在或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '408':
          description: 接收超时
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 幂等输入冲突/结果未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 输入超过限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 临时存储不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/{job_id}:
    get:
      summary: 读取转换任务进度
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConverterJob'
        '401':
          description: 无效 Token
        '422':
          description: 请求不合法
        '429':
          description: 处理容量不足
        '500':
          description: 服务处理错误
        '404':
          description: 任务不存在或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: 完成下载后的显式清理
      description: 删除任务临时输入与产物；还必须有 TTL 自动清理兜底。不能删除 Archive managed 原件。 仅终态可清理；queued/running返回409 JOB_ACTIVE。
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
      responses:
        '204':
          description: 清理完成
        '401':
          description: 无效 Token
        '404':
          description: 任务不存在
        '409':
          description: 任务仍在执行，不清理正在使用的临时目录
  /v1/jobs/{job_id}/result:
    get:
      summary: 取得统一解析 JSON
      description: status != completed 时返回 409；大资产不可直接内嵌到 JSON，应通过 artifact_ref 下载。 六格式基础输出包含规范blocks、plain_text/安全Markdown资产和实际属性候选。PDF真实页码，EPUB
        spine/href，DOCX/HTML真实标题路径或unknown，Markdown源行字符范围，TXT BOM去除后的Unicode码点。缺失置信度为null。扫描PDF可completed且text_available=false并有NO_TEXT_LAYER_OCR_REQUIRED，不伪造OCR成功。
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResult'
        '401':
          description: 无效 Token
        '422':
          description: 请求不合法
        '429':
          description: 处理容量不足
        '500':
          description: 服务处理错误
        '409':
          description: 任务尚未完成
        '404':
          description: 任务不存在或已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/artifacts/{artifact_ref}:
    get:
      summary: 下载某解析任务的受控产物
      description: 引用只能解析到本服务生成的任务产物，且受服务 Token 与任务期限约束；不可解释为任意服务器绝对路径。 使用随机opaque引用和任务映射，仅流式返回已验证普通文件；nosniff、attachment、no-store；显式清理与TTL后404。
      parameters:
      - name: artifact_ref
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{32}$
      responses:
        '200':
          description: 产物二进制
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: 无效 Token
        '404':
          description: 产物已过期/不存在
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: Archive application -> Converter 内部短期/可轮换 Token
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
    JobRef:
      type: object
      required:
      - job_id
      - status
      properties:
        job_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
      additionalProperties: false
    ConverterJob:
      type: object
      required:
      - job_id
      - status
      - attempts
      - created_at
      properties:
        job_id:
          type: string
          pattern: ^[0-9a-f]{32}$
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
        attempts:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        error:
          oneOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
        warnings:
          type: array
          items:
            type: string
      additionalProperties: false
    Block:
      type: object
      required:
      - id
      - index
      - type
      - text
      - locator
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        index:
          type: integer
          minimum: 0
        type:
          type: string
          enum:
          - heading
          - paragraph
          - list_item
          - table
          - image
          - page_break
          - unknown
        level:
          type: integer
          minimum: 1
          maximum: 6
        text:
          type: string
        table:
          type: object
          properties:
            headers:
              type: array
              items:
                type: string
            rows:
              type: array
              items:
                type: array
                items:
                  type: string
          additionalProperties: false
        locator:
          $ref: '#/components/schemas/Locator'
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
      additionalProperties: false
    MetadataCandidate:
      type: object
      required:
      - key
      - value
      - source
      properties:
        key:
          type: string
        value: {}
        source:
          type: string
          enum:
          - document_properties
          - parsed_content
          - ocr
          - epub_manifest
          - html_meta
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        locator:
          $ref: '#/components/schemas/Locator'
      additionalProperties: false
    Artifact:
      type: object
      required:
      - kind
      - media_type
      - artifact_ref
      - sha256
      - size_bytes
      properties:
        kind:
          type: string
          enum:
          - plain_text
          - markdown
          - json
          - preview_pdf
          - thumbnail
          - image
        media_type:
          type: string
        artifact_ref:
          type: string
          description: 只在当前任务内有效的受控引用，非绝对路径
          pattern: ^[0-9a-f]{32}$
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        size_bytes:
          type: integer
          minimum: 0
      additionalProperties: false
    ParseResult:
      type: object
      required:
      - schema_version
      - file_revision_id
      - parse_run_id
      - source_mime
      - parser
      - status
      - extraction
      - blocks
      - metadata_candidates
      - artifacts
      - warnings
      properties:
        schema_version:
          type: string
          const: '1.0'
        file_revision_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        parse_run_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
        source_mime:
          type: string
        parser:
          type: object
          required:
          - name
          - version
          properties:
            name:
              type: string
            version:
              type: string
          additionalProperties: false
        status:
          type: string
          enum:
          - completed
          - unsupported
          - failed
        language:
          type:
          - string
          - 'null'
        page_count:
          type:
          - integer
          - 'null'
          minimum: 1
        extraction:
          type: object
          required:
          - text_available
          - ocr_used
          - ocr_languages
          properties:
            text_available:
              type: boolean
            ocr_used:
              type: boolean
            ocr_languages:
              type: array
              items:
                type: string
          additionalProperties: false
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/Block'
          maxItems: 10000
        metadata_candidates:
          type: array
          items:
            $ref: '#/components/schemas/MetadataCandidate'
          maxItems: 1000
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
          maxItems: 100
        warnings:
          type: array
          items:
            type: string
          maxItems: 1000
      additionalProperties: false
    Capabilities:
      type: object
      required:
      - schema_versions
      - supported_input_types
      - ocr_available
      properties:
        schema_versions:
          type: array
          items:
            type: string
        supported_input_types:
          type: array
          items:
            type: string
          description: 基础解析：text/plain,text/markdown,text/html,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/pdf,application/epub+zip，以及image/png,image/jpeg,image/tiff；以实际capabilities为准。
        ocr_available:
          type: boolean
        max_file_bytes:
          type: integer
        max_pages:
          type: integer
          description: PDF页数上限，默认200；DOCX/HTML/Markdown/TXT/EPUB不推测物理页数；图片page_count对应实际帧数。
        preview_available:
          type: boolean
          description: 当前支持PDF及PNG/JPEG/TIFF的重新编码PNG缩略图；不代表完整原件预览或DOCX/EPUB排版渲染
        ocr_languages:
          type: array
          description: 当前通过模型SHA256校验的可用语言；支持eng/chi_sim。开启OCR不传语言默认eng；禁用服务OCR或缺失模型时相应能力不声明
          items:
            type: string
        max_output_bytes:
          type: integer
          description: 输出JSON及产物字节保护上限
        max_blocks:
          type: integer
          description: 块数量上限
        max_jobs:
          type: integer
          description: 含已完成未清理任务的spool容量
        ttl_seconds:
          type: number
          description: 从接收时间算起的终态保留时间，活动任务不被TTL中断
        wall_seconds:
          type: number
          description: 单次子进程墙钟期限
        cpu_seconds:
          type: integer
          description: 子进程CPU秒限制
        memory_bytes:
          type: integer
          description: 子进程RLIMIT_AS地址空间限制，不等于容器RSS额度
        max_archive_entries:
          type: integer
          minimum: 1
          description: ZIP成员数上限，默认1024
        max_archive_bytes:
          type: integer
          minimum: 1
          description: ZIP声明膨胀总量及累计读取预算，默认16MiB
        max_archive_member_bytes:
          type: integer
          minimum: 1
          description: 单个ZIP成员及PDF解码内容流上限，默认8MiB
        max_compression_ratio:
          type: integer
          minimum: 1
          description: ZIP成员压缩比上限，默认200
        preview_input_types:
          type: array
          items:
            type: string
          description: 支持缩略图的输入MIME
        preview_kind:
          type: string
          const: thumbnail
        max_preview_pages:
          type: integer
          description: 默认5，每页一张PNG，最大边1024像素
        max_ocr_pages:
          type: integer
          description: 默认10，单任务实际OCR页数上限，超过则任务失败OCR_PAGE_LIMIT
        max_image_pixels:
          type: integer
          description: 默认12000000，单帧解码/单PDF页渲染像素上限
        render_dpi:
          type: integer
          description: PDF栅格化默认120DPI
    Locator:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - page
          - section
          - character
          - epub
          - unknown
        page:
          type: integer
          minimum: 1
        spine_index:
          type: integer
          minimum: 0
        href:
          type: string
        heading_path:
          type: array
          items:
            type: string
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
      additionalProperties: false
      description: 真实定位；character为UTF-8 BOM移除后Unicode码点范围[start,end)，不得伪造页码。page需page；epub需spine_index/href。
