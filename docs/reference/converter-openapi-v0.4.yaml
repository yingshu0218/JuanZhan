openapi: 3.1.0
info:
  title: Archive Document Converter (independent service)
  version: 0.4.0
  description: 不接 LLM 的独立文档转换与 OCR 服务。该 API 只负责解析/转换与返回受控派生资产，不得写 Archive 的业务数据库。默认只在 Docker 内网开放，鉴权使用服务 Bearer
    Token。
servers:
- url: /
  description: 转换器独立容器的 HTTP 根路径
security:
- serviceToken: []
paths:
  /healthz:
    get:
      summary: 容器本地健康检查，不应经公共网关暴露
      security: []
      responses:
        '200':
          description: 运行中
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /v1/capabilities:
    get:
      summary: 格式和 OCR 能力声明
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          description: 无效 Token
        '422':
          description: 请求不合法
        '429':
          description: 处理容量不足
        '500':
          description: 服务处理错误
  /v1/jobs:
    post:
      summary: 上传文件并启动隔离的解析任务
      description: 只接受 multipart 二进制输入；拒绝客户端指定服务器文件路径或 URL；请求元数据使用 Archive 生成的 FileRevision/ParseRun ID，不授予数据库访问权限。文件大小、页数、CPU/内存/执行时限均在服务端受控。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - file_revision_id
              - parse_run_id
              properties:
                file:
                  type: string
                  format: binary
                file_revision_id:
                  type: string
                parse_run_id:
                  type: string
                declared_mime:
                  type: string
                ocr_enabled:
                  type: boolean
                  default: false
                ocr_languages:
                  type: string
                  description: 逗号分隔：chi_sim,eng；需在服务端白名单验证
                generate_preview:
                  type: boolean
                  default: true
      responses:
        '501':
          description: 当前骨架未实现转换，不创建任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '202':
          description: 任务已接受
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobRef'
        '401':
          description: 无效 Token
        '422':
          description: 请求不合法
        '429':
          description: 处理容量不足
        '500':
          description: 服务处理错误
  /v1/jobs/{job_id}:
    get:
      summary: 读取转换任务进度
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConverterJob'
        '401':
          description: 无效 Token
        '422':
          description: 请求不合法
        '429':
          description: 处理容量不足
        '500':
          description: 服务处理错误
    delete:
      summary: 完成下载后的显式清理
      description: 删除任务临时输入与产物；还必须有 TTL 自动清理兜底。不能删除 Archive managed 原件。
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: 清理完成
        '401':
          description: 无效 Token
        '404':
          description: 任务不存在
  /v1/jobs/{job_id}/result:
    get:
      summary: 取得统一解析 JSON
      description: status != completed 时返回 409；大资产不可直接内嵌到 JSON，应通过 artifact_ref 下载。
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResult'
        '401':
          description: 无效 Token
        '422':
          description: 请求不合法
        '429':
          description: 处理容量不足
        '500':
          description: 服务处理错误
        '409':
          description: 任务尚未完成
  /v1/artifacts/{artifact_ref}:
    get:
      summary: 下载某解析任务的受控产物
      description: 引用只能解析到本服务生成的任务产物，且受服务 Token 与任务期限约束；不可解释为任意服务器绝对路径。
      parameters:
      - name: artifact_ref
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 产物二进制
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          description: 无效 Token
        '404':
          description: 产物已过期/不存在
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      description: Archive application -> Converter 内部短期/可轮换 Token
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
    JobRef:
      type: object
      required:
      - job_id
      - status
      properties:
        job_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
    ConverterJob:
      type: object
      required:
      - job_id
      - status
      - attempts
      - created_at
      properties:
        job_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
        attempts:
          type: integer
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        error:
          oneOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
        warnings:
          type: array
          items:
            type: string
    Block:
      type: object
      required:
      - id
      - index
      - type
      - text
      - locator
      properties:
        id:
          type: string
        index:
          type: integer
          minimum: 0
        type:
          type: string
          enum:
          - heading
          - paragraph
          - list_item
          - table
          - image
          - page_break
          - unknown
        level:
          type: integer
          minimum: 1
          maximum: 6
        text:
          type: string
        table:
          type: object
          properties:
            headers:
              type: array
              items:
                type: string
            rows:
              type: array
              items:
                type: array
                items:
                  type: string
        locator:
          type: object
          required:
          - kind
          properties:
            kind:
              type: string
              enum:
              - page
              - section
              - character
              - epub
              - unknown
            page:
              type: integer
              minimum: 1
            spine_index:
              type: integer
              minimum: 0
            href:
              type: string
            heading_path:
              type: array
              items:
                type: string
            start:
              type: integer
              minimum: 0
            end:
              type: integer
              minimum: 0
          additionalProperties: true
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
    MetadataCandidate:
      type: object
      required:
      - key
      - value
      - source
      properties:
        key:
          type: string
        value: {}
        source:
          type: string
          enum:
          - document_properties
          - parsed_content
          - ocr
          - epub_manifest
          - html_meta
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        locator:
          type: object
          additionalProperties: true
    Artifact:
      type: object
      required:
      - kind
      - media_type
      - artifact_ref
      properties:
        kind:
          type: string
          enum:
          - plain_text
          - markdown
          - json
          - preview_pdf
          - thumbnail
          - image
        media_type:
          type: string
        artifact_ref:
          type: string
          description: 只在当前任务内有效的受控引用，非绝对路径
        sha256:
          type: string
        size_bytes:
          type: integer
    ParseResult:
      type: object
      required:
      - schema_version
      - file_revision_id
      - parse_run_id
      - source_mime
      - parser
      - status
      - extraction
      - blocks
      - metadata_candidates
      - artifacts
      - warnings
      properties:
        schema_version:
          type: string
          const: '1.0'
        file_revision_id:
          type: string
        parse_run_id:
          type: string
        source_mime:
          type: string
        parser:
          type: object
          required:
          - name
          - version
          properties:
            name:
              type: string
            version:
              type: string
        status:
          type: string
          enum:
          - completed
          - unsupported
          - failed
        language:
          type:
          - string
          - 'null'
        page_count:
          type:
          - integer
          - 'null'
          minimum: 1
        extraction:
          type: object
          required:
          - text_available
          - ocr_used
          - ocr_languages
          properties:
            text_available:
              type: boolean
            ocr_used:
              type: boolean
            ocr_languages:
              type: array
              items:
                type: string
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/Block'
        metadata_candidates:
          type: array
          items:
            $ref: '#/components/schemas/MetadataCandidate'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/Artifact'
        warnings:
          type: array
          items:
            type: string
    Capabilities:
      type: object
      required:
      - schema_versions
      - supported_input_types
      - ocr_available
      properties:
        schema_versions:
          type: array
          items:
            type: string
        supported_input_types:
          type: array
          items:
            type: string
        ocr_available:
          type: boolean
        max_file_bytes:
          type: integer
        max_pages:
          type: integer
