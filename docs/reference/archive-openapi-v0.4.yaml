      summary: 外部档案取消索引并添加排除规则
      operationId: post_sources_id_exclude_entry
      description: 异步任务原子新增精确文件路径排除规则并将关联Document置入逻辑回收站，不删除源文件。有Document时必须提供expected_document_version，无Document的待匹配条目可省略。活动请求复用首个任务快照；待处理屏障立即阻止扫描重导，失败终态释放屏障；扫描准备和发布均检查排除版本，变化则重试而不应用过期缺失/重关联。规则只匹配精确文件路径，不按hash全局屏蔽副本。 使用 Cookie 会话调用时须携带 X-CSRF-Token；API Bearer 不需要 CSRF。
      x-roadmap-phase: MVP
      parameters:
