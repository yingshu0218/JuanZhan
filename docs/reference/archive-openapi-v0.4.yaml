          - scanning
          - offline
          - error
          - disabled
        initial_import_policy:
          type: string
          enum:
          - tree
          - flat
        initial_import_completed_at:
          type:
          - string
          - 'null'
        new_file_target_folder_id:
          type:
          - string
          - 'null'
        scan_interval_minutes:
          type:
          - integer
          - 'null'
        last_successful_scan_at:
          type:
          - string
          - 'null'
      required:
      - id
      - space_id
      - name
      - kind
      - root_alias
      - status
    SourceEntry:
      type: object
      properties:
        id: *id001
        source_id: *id001
        document_id:
          type:
          - string
          - 'null'
        relative_path:
          type: string
        size_bytes: *id004
        status:
          type: string
          enum:
          - available
          - suspected_missing
          - missing
          - needs_match
        sha256:
          type:
          - string
          - 'null'
      required:
      - id
      - source_id
      - relative_path
      - status
    SourceExclusion:
      type: object
      properties:
        id: *id001
        source_id: *id001
        relative_path:
          type: string
        reason:
          type: string
        created_at: *id006
      required:
      - id
      - source_id
      - relative_path
      - created_at
    ScanPreview:
      type: object
      properties:
