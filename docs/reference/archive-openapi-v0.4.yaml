components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 管理员 API Token；应限制日志暴露和轮换
    sessionAuth:
      type: apiKey
      in: cookie
      name: archive_session
      description: Web 管理会话；非 GET 的会话请求必须携带 X-CSRF-Token
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema: *id001
    FolderId:
      name: id
      in: path
      required: true
      schema: *id001
    SourceId:
      name: id
      in: path
      required: true
      schema: *id001
    JobId:
      name: id
      in: path
      required: true
      schema: *id001
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            current_document_version:
              type:
              - integer
              - 'null'
          required:
          - code
          - message
      required:
      - error
    PageInfo:
      type: object
      properties:
        page: *id004
        page_size: *id004
        total: *id004
      required:
      - page
      - page_size
      - total
    Job:
      type: object
      properties:
        id: *id001
        kind:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - cancelled
        attempts: *id004
        max_attempts: *id004
        progress_done: *id004
        progress_total:
          type:
          - integer
          - 'null'
        result: &id005
          description: 任意合法 JSON 值
        error: *id005
        created_at: &id006
          type: string
          format: date-time
        updated_at: *id006
      required:
      - id
      - kind
      - status
      - attempts
      - max_attempts
      - created_at
      - updated_at
    AsyncJob:
      type: object
      properties:
        job_id: *id001
        status:
          type: string
      required:
      - job_id
      - status
    Space:
      type: object
      properties:
        id: *id001
        name:
          type: string
        created_at: *id006
      required:
      - id
      - name
      - created_at
    Folder:
      type: object
      properties:
        id: *id001
        space_id: *id001
        parent_id:
          type:
          - string
          - 'null'
        name:
          type: string
        name_norm:
          type: string
      required:
      - id
      - space_id
      - parent_id
      - name
    Tag:
      type: object
      properties:
        id: *id001
        space_id: *id001
        name:
          type: string
        color:
          type:
          - string
          - 'null'
        description:
          type: string
      required:
      - id
      - space_id
      - name
    DocumentType:
      type: object
      properties:
        id: *id001
        space_id: *id001
        key:
          type: string
        label:
          type: string
        is_active: *id002
        fields: *id003
      required:
      - id
      - space_id
      - key
      - label
      - is_active
    FieldDefinition:
      type: object
      properties:
        id: *id001
        space_id: *id001
        key:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        label:
          type: string
        type: *id007
        constraints:
          type: object
          additionalProperties: true
        searchable: *id002
        filterable: *id002
        is_active: *id002
      required:
      - id
      - space_id
      - key
      - label
      - type
      - is_active
    MetadataEntry:
      type: object
      properties:
        field_definition_id: *id001
        key:
          type: string
        value: *id005
        origin:
          type: string
          enum:
          - manual
          - imported
          - rule
          - extracted
        is_confirmed: *id002
        source_parse_run_id:
          type:
          - string
          - 'null'
        updated_at: *id006
      required:
      - key
      - value
      - origin
      - is_confirmed
    Document:
      type: object
      properties:
        id: *id001
        space_id: *id001
        folder_id:
          type:
          - string
          - 'null'
        title:
          type: string
        description:
          type: string
        document_date:
          type:
          - string
          - 'null'
        document_type_id:
          type:
          - string
          - 'null'
        tag_ids:
          type: array
          items: *id001
        triage_status:
          type: string
          enum:
          - needs_review
          - filed
        is_favorite: *id002
        document_version: *id004
        current_revision_id:
          type:
          - string
          - 'null'
        current_parse_run_id:
          type:
          - string
          - 'null'
        origin_kind:
          type: string
          enum:
          - managed
          - external
        source_id:
          type:
          - string
          - 'null'
        availability_status:
          type: string
          enum:
          - available
          - source_offline
          - suspected_missing
          - missing
          - needs_match
        processing_status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - unsupported
          - not_started
        content_stale: *id002
        imported_at: *id006
        deleted_at:
          type:
          - string
          - 'null'
      required:
      - id
      - space_id
      - title
      - triage_status
      - document_version
      - availability_status
      - processing_status
      - content_stale
      - imported_at
    DocumentPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        page: *id004
        page_size: *id004
        total: *id004
      required:
      - items
      - page
      - page_size
      - total
    FileRevision:
      type: object
      properties:
        id: *id001
        revision_no: *id004
        storage_kind:
          type: string
          enum:
          - managed
          - external
        original_filename:
          type: string
        mime_type:
          type: string
        sha256:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        created_at: *id006
        binary_available: *id002
        can_restore_binary: *id002
      required:
      - id
      - revision_no
      - storage_kind
      - original_filename
      - mime_type
      - sha256
      - size_bytes
      - created_at
      - binary_available
      - can_restore_binary
    ParseRun:
      type: object
      properties:
        id: *id001
        revision_id: *id001
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - unsupported
        schema_version:
          type: string
        parser_name:
          type: string
        parser_version:
          type: string
        ocr_used: *id002
        text_available: *id002
        language:
          type:
          - string
          - 'null'
        page_count:
          type:
          - integer
          - 'null'
        candidates:
          type: array
          items:
            type: object
            properties:
              id: *id001
              key:
                type: string
              value: *id005
              confidence:
                type:
                - number
                - 'null'
              provenance: *id005
            required:
            - id
            - key
            - value
        warnings:
          type: array
          items:
            type: string
        created_at: *id006
      required:
      - id
      - revision_id
      - status
      - schema_version
      - parser_name
      - parser_version
      - created_at
    ContentBlock:
      type: object
      properties:
        id: *id001
        index: *id004
        type:
          type: string
          enum:
          - heading
          - paragraph
          - list_item
          - table
          - image
          - page_break
          - unknown
        text:
          type: string
        structure:
          type: object
          additionalProperties: true
        locator:
          type: object
          properties:
            kind:
              type: string
              enum:
              - page
              - section
              - character
              - epub
              - unknown
          required:
          - kind
          additionalProperties: true
        confidence:
          type:
          - number
          - 'null'
      required:
      - id
      - index
      - type
      - text
      - locator
    ContentResponse:
      type: object
      properties:
        document_id: *id001
        content_revision_id: *id001
        parse_run_id: *id001
        format:
          type: string
          enum:
          - text
          - markdown
          - blocks
        stale_for_current_revision: *id002
        body:
          oneOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/ContentBlock'
        warnings:
          type: array
          items:
            type: string
      required:
      - document_id
      - content_revision_id
      - parse_run_id
      - format
      - stale_for_current_revision
      - body
    Source:
      type: object
      properties:
        id: *id001
        space_id: *id001
        name:
          type: string
        kind:
          type: string
          enum:
          - managed
          - external
        root_alias:
          type: string
          description: 已授权的挂载别名；不暴露服务端绝对路径
        status:
          type: string
