  /jobs/{id}/undo:
    post:
      tags: [Jobs]
      summary: 撤销已完成批量任务的成功变更
      operationId: post_jobs_id_undo
      description: >-
        无请求体。只接受已完成的正向document_batch，按原成功审计创建固定撤销集合；跳过项与失败项不进入撤销。
        相同原任务重复调用返回同一个撤销job。只在档案版本仍等于原任务执行后版本时恢复逻辑状态并递增版本；
        后续编辑、失效引用或归档约束使相应项失败，不覆盖新编辑。撤销任务不可再次撤销。
        Cookie写操作须CSRF，Bearer无需CSRF；通过GET /jobs/{id}读取逐项结果。
      parameters:
      - $ref: '#/components/parameters/JobId'
      - name: X-CSRF-Token
