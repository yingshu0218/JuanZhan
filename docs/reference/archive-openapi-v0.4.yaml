        constraints按字段类型验证规则，紧凑JSON限16KiB/8层嵌套/有限数值；规则词汇见FieldDefinition.constraints。
        searchable控制异步全文索引，filterable控制类型化结构化筛选。Cookie写入须CSRF，Bearer无需CSRF。
