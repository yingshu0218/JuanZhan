openapi: 3.1.0
info:
  title: 档案库 Archive API
  version: 0.4.3
  description: MVP HTTP 契约。业务规则见 archive-prd-v0.4.md，持久化模型见 archive-schema-v0.4.sql。文件原件与外部存储只读隔离。所有时间为 UTC RFC3339；各
    ID 为不透明字符串。
servers:
- url: /api/v1
  description: 由反向代理提供同域路径
tags:
- name: Spaces
- name: Folders
- name: Tags
- name: TypesAndFields
- name: Documents
- name: Search
- name: Sources
- name: Jobs
- name: System
security:
- bearerAuth: []
- sessionAuth: []
paths:
  /auth/session:
    get:
      tags:
      - Auth
      summary: 读取会话；无有效 Cookie 时创建十分钟匿名会话供登录 CSRF 使用
      responses:
        '200':
          description: '会话与 CSRF；Cache-Control: no-store，设置 HttpOnly SameSite=Strict
            Cookie'
          content:
            application/json:
              schema: &auth001
                type: object
                required:
                - authenticated
                - csrf_token
                - expires_at
                properties:
                  authenticated:
                    type: boolean
                  csrf_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                    description: UTC RFC3339
        '429':
          description: 匿名会话容量已满，请稍后重试
        '401': &auth002
          description: 请求失败，使用统一 Error 响应体
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
  /auth/login:
    post:
      tags:
      - Auth
      summary: 单管理员登录；要求匿名或现有会话 Cookie 与 CSRF，成功轮换会话，固定八小时过期
      responses:
        '200':
          description: 已登录，会话和 CSRF 均轮换
          content:
            application/json:
              schema: *auth001
        '401': *auth002
        '403': *auth002
        '422': *auth002
        '429': *auth002
        '503': *auth002
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - username
              - password
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 100
                password:
                  type: string
                  minLength: 1
                  maxLength: 1024
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
  /auth/logout:
    post:
      tags:
      - Auth
      summary: 撤销当前 Cookie 会话并清除 Cookie；不接受 API Token
      responses:
        '204':
          description: 已退出
        '401': *auth002
        '403': *auth002
      security:
      - sessionAuth: []
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
  /auth/tokens:
    get:
      tags:
      - Auth
      summary: 列出未撤销且未过期 API Token 的元信息；仅管理员 Cookie 会话
      responses:
        '200':
          description: 不返回 Token 明文或摘要
          content:
            application/json:
              schema:
                type: array
                items: &auth003
                  type: object
                  required:
                  - id
                  - name
                  - created_at
                  - expires_at
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    expires_at:
                      type: string
                      format: date-time
        '401': *auth002
        '403': *auth002
      security:
      - sessionAuth: []
    post:
      tags:
      - Auth
      summary: 创建管理员权限 API Token；仅 Cookie 会话且通过 CSRF，明文仅返回一次
      responses:
        '201':
          description: 'Token 明文仅此一次；Cache-Control: no-store'
          content:
            application/json:
              schema:
                allOf:
                - *auth003
                - type: object
                  required:
                  - token
                  properties:
                    token:
                      type: string
        '401': *auth002
        '403': *auth002
        '422': *auth002
      security:
      - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 90
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
  /auth/tokens/{id}:
    delete:
      tags:
      - Auth
      summary: 立即撤销指定 API Token（幂等）；仅 Cookie 会话且通过 CSRF
      responses:
        '204':
          description: 已撤销或不存在
        '401': *auth002
        '403': *auth002
      security:
      - sessionAuth: []
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema:
          type: string
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
  /healthz:
    servers:
    - url: /
    get:
      tags: [System]
      summary: 内部运维就绪检查，不经公共网关暴露
      operationId: get_healthz
      security: []
      responses:
        '200':
          description: 数据库及初始迁移可用
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
        '503':
          description: 数据库未就绪
  /spaces:
    get:
      tags:
      - Spaces
      summary: 列出 Space
      operationId: get_spaces
      description: 单管理员可列出全部空间，稳定按 created_at/id 排序；Space 名称不要求唯一。
      x-roadmap-phase: MVP
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Space'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Spaces
      summary: 创建 Space
      x-catalog-rules: 名称去除两端空白并以 NFC 保存，排除控制字符；文件夹与标签使用 NFKC+casefold 判重，名称最多255字符。不支持修改 space_id。
      operationId: post_spaces
      description: ' 使用 Cookie 会话调用时须携带 X-CSRF-Token；API Bearer 不需要 CSRF。'
      x-roadmap-phase: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
              required:
              - name
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        description: 使用 Cookie 会话时必填，使用 Bearer Token 时无需填写
        schema:
          type: string
  /folders:
    get:
      tags:
      - Folders
      summary: 读取逻辑文件夹树
      operationId: get_folders
      description: 返回含 parent_id 的扁平树；未传 parent_id 为全部，传入则仅直属子项。space_id 可选，未知空间或父目录返回 404，父目录跨空间返回 422。
      x-roadmap-phase: MVP
      parameters:
      - name: space_id
        in: query
        schema:
          type: string
      - name: parent_id
        in: query
        schema:
          type: string
      responses:
        '422':
          $ref: '#/components/responses/Validation'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Folder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Folders
      summary: 创建逻辑文件夹
      operationId: post_folders
      description: ' 使用 Cookie 会话调用时须携带 X-CSRF-Token；API Bearer 不需要 CSRF。'
      x-roadmap-phase: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderCreate'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        description: 使用 Cookie 会话时必填，使用 Bearer Token 时无需填写
        schema:
          type: string
  /folders/{id}:
    patch:
      tags:
      - Folders
      summary: 重命名或移动逻辑文件夹
      operationId: patch_folders_id
      description: ' 使用 Cookie 会话调用时须携带 X-CSRF-Token；API Bearer 不需要 CSRF。'
      x-roadmap-phase: MVP
      parameters:
      - $ref: '#/components/parameters/FolderId'
      - name: X-CSRF-Token
        in: header
        required: false
        description: 使用 Cookie 会话时必填，使用 Bearer Token 时无需填写
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderPatch'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Folder'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/NotFound'
  /folders/{id}/delete:
    post:
      tags:
      - Folders
      summary: 删除逻辑文件夹，需明确策略
      operationId: post_folders_id_delete
      description: ' 使用 Cookie 会话调用时须携带 X-CSRF-Token；API Bearer 不需要 CSRF。'
      x-roadmap-phase: MVP
      parameters:
      - $ref: '#/components/parameters/FolderId'
      - name: X-CSRF-Token
        in: header
        required: false
        description: 使用 Cookie 会话时必填，使用 Bearer Token 时无需填写
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode:
                  type: string
                  enum:
                  - only_if_empty
                  - move_contents_to_parent
                  - trash_contents
              required:
              - mode
      responses:
        '501':
          description: move_contents_to_parent 与 trash_contents 等待文档事务实现；当前仅支持 only_if_empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '204':
          description: 已完成（子树逻辑档案处理后生效）
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '404':
          $ref: '#/components/responses/NotFound'
  /tags:
    get:
      tags:
      - Tags
      summary: 列出标签
      operationId: get_tags
      description: space_id 为可选过滤条件，未知空间返回 404；未传则返回全部空间数据，采用稳定排序。
      x-roadmap-phase: MVP
      parameters:
      - name: space_id
        in: query
        schema:
          type: string
      responses:
        '422':
          $ref: '#/components/responses/Validation'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Tags
      summary: 创建标签
      operationId: post_tags
      description: ' 使用 Cookie 会话调用时须携带 X-CSRF-Token；API Bearer 不需要 CSRF。'
      x-roadmap-phase: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                space_id: &id001
                  type: string
                  description: 不透明 ID，调用方不得假设自增或文件路径格式
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                color:
                  type: [string, "null"]
                  maxLength: 100
                description:
                  type: string
                  maxLength: 4096
              required:
              - space_id
              - name
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        description: 使用 Cookie 会话时必填，使用 Bearer Token 时无需填写
        schema:
          type: string
  /tags/{id}:
    patch:
      tags:
      - Tags
      summary: 更新标签
      operationId: patch_tags_id
      description: ' 使用 Cookie 会话调用时须携带 X-CSRF-Token；API Bearer 不需要 CSRF。'
      x-roadmap-phase: MVP
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: X-CSRF-Token
        in: header
        required: false
        description: 使用 Cookie 会话时必填，使用 Bearer Token 时无需填写
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                color:
                  type: [string, "null"]
                  maxLength: 100
                description:
                  type: string
                  maxLength: 4096
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Tags
      summary: 删除标签，仅解除关联、不删除档案
      operationId: delete_tags_id
      description: ' 使用 Cookie 会话调用时须携带 X-CSRF-Token；API Bearer 不需要 CSRF。'
      x-roadmap-phase: MVP
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: X-CSRF-Token
        in: header
        required: false
        description: 使用 Cookie 会话时必填，使用 Bearer Token 时无需填写
        schema:
          type: string
      responses:
        '204':
          description: 已删除标签
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /document-types:
    get:
      tags:
      - TypesAndFields
      summary: 列出业务文档类型
      operationId: get_document_types
      description: space_id 为可选过滤条件，未知空间返回 404；未传则返回全部空间数据，采用稳定排序。
      x-roadmap-phase: MVP
      parameters:
      - name: space_id
        in: query
        schema:
          type: string
      responses:
        '422':
          $ref: '#/components/responses/Validation'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - TypesAndFields
      summary: 创建业务文档类型
      operationId: post_document_types
      description: ' 使用 Cookie 会话调用时须携带 X-CSRF-Token；API Bearer 不需要 CSRF。'
      x-roadmap-phase: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                space_id: *id001
                key:
                  type: string
                  pattern: ^[a-z][a-z0-9_]*$
                  maxLength: 255
                label:
                  type: string
                  minLength: 1
                  maxLength: 255
                fields: &id003
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      field_definition_id: *id001
                      required_for_filing: &id002
                        type: boolean
                      display_order:
                        allOf:
                        - &id004
                          type: integer
                        - minimum: -2147483648
                          maximum: 2147483647
                    required:
                    - field_definition_id
                    - required_for_filing
              required:
              - space_id
              - key
              - label
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        description: 使用 Cookie 会话时必填，使用 Bearer Token 时无需填写
        schema:
          type: string
  /document-types/{id}:
    patch:
      tags:
      - TypesAndFields
      summary: 编辑类型名称/字段模板（不删除历史值）
      operationId: patch_document_types_id
      description: ' 使用 Cookie 会话调用时须携带 X-CSRF-Token；API Bearer 不需要 CSRF。'
      x-roadmap-phase: MVP
      parameters:
      - $ref: '#/components/parameters/DocumentId'
      - name: X-CSRF-Token
        in: header
        required: false
        description: 使用 Cookie 会话时必填，使用 Bearer Token 时无需填写
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 255
                is_active: *id002
                fields: *id003
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
  /field-definitions:
    get:
      tags:
      - TypesAndFields
      summary: 列出自定义字段定义
      operationId: get_field_definitions
      description: ''
      x-roadmap-phase: MVP
      parameters:
      - name: space_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FieldDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - TypesAndFields
      summary: 创建自定义字段定义
      operationId: post_field_definitions
      description: ' 使用 Cookie 会话调用时须携带 X-CSRF-Token；API Bearer 不需要 CSRF。'
      x-roadmap-phase: MVP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                space_id: *id001
                key:
                  type: string
                label:
                  type: string
                type: &id007
                  type: string
                  enum:
                  - text
                  - long_text
                  - integer
                  - decimal
                  - date
                  - boolean
                  - single_select
                constraints:
                  type: object
                  additionalProperties: true
                searchable: *id002
                filterable: *id002
              required:
              - space_id
              - key
              - label
              - type
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldDefinition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        description: 使用 Cookie 会话时必填，使用 Bearer Token 时无需填写
        schema:
          type: string
