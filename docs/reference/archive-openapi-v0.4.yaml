  /sources/{id}/scan:
    post:
      tags:
      - Sources
      summary: 执行首次或增量扫描
      operationId: post_sources_id_scan
      description: >-
        支持mode=initial和incremental；incremental要求已完成首扫，否则409 SOURCE_INITIAL_REQUIRED。
        首扫按来源配置tree/flat和初始整理状态登记，绝不移动/复制外部字节；tree在目标逻辑文件夹下复制相对目录（含空目录），flat全部放到初始目标。
        同来源活动initial请求返回原Job，preview与initial互斥（409 SOURCE_SCAN_BUSY）。首次成功后重放返回原completed Job，不重新导入或覆盖后续人工整理。
        遍历/流式哈希/MIME嗅探在写锁外完成，匿名临时元数据清单最多64MiB；最多100000访问项、64层、300秒、3次尝试。只读取候选扩展名文件，跳过不支持/非法/符号链接/特殊项。
        发布在同一租约围栏事务中创建逻辑目录、SourceEntry、Document、外部Revision、事件、幂等parse任务，并完成Job/scan_run/首次导入标记；任何失败整体回滚。
        与现有目录或规范名碰撞时SOURCE_FOLDER_CONFLICT，不静默合并；修复逻辑目录冲突后可显式新建首扫。相同哈希不同路径分别建档。
        原件可用性仍保守unknown，登记哈希只代表观察到的字节，不保证旧字节可恢复；解析handler尚未实现，任务排队不代表解析成功。
        增量不重建目录；新增文件进入new_file_target_folder_id且始终needs_review。已知路径每次重算SHA-256，大小/mtime相同也检测内容变化；追加外部Revision并保留人工分类/字段/旧成功解析。
        改路径仅在旧来源全部条目与当前观测中hash+size均唯一时自动重关联；重复hash即使inode提示相同也不自动匹配，标needs_match，新路径以document_id=null的条目保留，显式匹配接口尚未实现。
        完整在线增量中第一次缺失为suspected_missing，第二个独立成功扫描才为missing；失败/离线不更改条目并清除未完成的缺失确认凭据，重现则恢复available。
        挂载根身份摘要不匹配SOURCE_ROOT_CHANGED失败；旧版本无摘要仅可通过精确路径/hash/大小/inode提示锚点或原本空库存建立基线，否则SOURCE_ROOT_UNVERIFIED，不能批量判失联。
        所有增量变更/状态/事件/任务与Job结果同事务提交，重试或过期租约不重复生效。Job.result结构分别见SourceInitialResult与SourceIncrementalResult。使用Cookie会话时须携带X-CSRF-Token；Bearer无需CSRF。
      x-roadmap-phase: MVP
      parameters:
      - $ref: '#/components/parameters/SourceId'
      - name: X-CSRF-Token
        in: header
        required: false
        description: 使用 Cookie 会话时必填，使用 Bearer Token 时无需填写
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                mode:
                  type: string
                  enum:
                  - initial
                  - incremental
              required:
              - mode
      responses:
        '202':
          description: 扫描任务已提交
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
