      description: 鉴权及Cookie CSRF，在同一写事务复核expected_document_version与expected_revision_id；回收拒绝。request_id绑定该档案、Revision及OCR/语言/预览选项，重发同请求复用原Job，异选项409。其他活动解析返回409；已有成功正文须force=true明确重跑。OCR默认关闭，语言仅eng/chi_sim且无重复；模型可用性由后台Converter最终确认。只排队，不覆盖人工字段/旧成功正文或增加业务版本；重试按Job固定预算。
