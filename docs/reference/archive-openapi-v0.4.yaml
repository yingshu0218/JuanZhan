        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expected_document_version:
                  type: integer
                  minimum: 1
                  maximum: 9223372036854775806
                expected_revision_id:
                  type: string
                  minLength: 1
                  maxLength: 255
                request_id:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{1,128}$
                ocr:
                  type: boolean
                  default: false
                force:
                  type: boolean
                  default: false
                ocr_languages:
                  type: string
                  maxLength: 255
                  default: ''
                generate_preview:
                  type: boolean
                  default: true
              required:
              - expected_document_version
              - expected_revision_id
              - request_id
