          - snapshot
        expected_versions:
          type: object
          additionalProperties: *id004
        operation:
          type: string
          enum:
          - move_folder
          - add_tags
          - remove_tags
          - set_type
          - set_triage
          - set_favorite
          - trash
          - reprocess
          - set_metadata
        payload:
          type: object
          additionalProperties: true
      required:
      - space_id
      - document_ids
      - selection_mode
      - operation
      - payload
    BatchResult:
      type: object
      properties:
        job_id: *id001
        succeeded: *id004
        skipped: *id004
        failed: *id004
        items:
          type: array
          items:
            type: object
            properties:
              document_id: *id001
              status:
                type: string
                enum:
                - succeeded
                - skipped
                - failed
              error_code:
                type: string
            required:
            - document_id
            - status
      required:
      - job_id
      - succeeded
      - skipped
      - failed
      - items
    DocumentPatch:
      type: object
      properties:
        expected_document_version: *id004
        title:
          type: string
        description:
          type: string
        document_date:
          type:
          - string
          - 'null'
          format: date
        folder_id:
          type:
          - string
          - 'null'
        document_type_id:
          type:
          - string
          - 'null'
        is_favorite: *id002
        tags_add:
          type: array
          items: *id001
        tags_remove:
          type: array
          items: *id001
      required:
      - expected_document_version
      additionalProperties: false
    MetadataPatch:
      type: object
      properties:
        expected_document_version: *id004
        values:
          type: object
          additionalProperties: true
          description: 字段 key→值；decimal 字段必须用字符串；null 表示删除该字段值
        confirm: *id002
      required:
      - expected_document_version
      - values
      - confirm
    TriageRequest:
      type: object
      properties:
        expected_document_version: *id004
        triage_status:
          type: string
          enum:
          - needs_review
          - filed
      required:
      - expected_document_version
      - triage_status
    FolderCreate:
      type: object
      additionalProperties: false
      properties:
        space_id: *id001
        parent_id:
          type:
          - string
          - 'null'
        name:
          type: string
          minLength: 1
          maxLength: 255
      required:
      - space_id
      - name
    FolderPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        parent_id:
          type:
          - string
          - 'null'
      minProperties: 1
    SourceCreate:
      type: object
      properties:
        space_id: *id001
        name:
          type: string
        kind:
          type: string
          enum:
          - external
        root_alias:
          type: string
          description: 只能传部署时预配置的挂载别名
        initial_import_policy:
          type: string
          enum:
          - tree
          - flat
        initial_target_folder_id:
          type:
          - string
          - 'null'
        initial_triage_status:
          type: string
          enum:
          - filed
          - needs_review
        new_file_target_folder_id:
          type:
          - string
          - 'null'
        scan_interval_minutes:
          type:
          - integer
          - 'null'
          minimum: 0
      required:
      - space_id
      - name
      - kind
      - root_alias
      - initial_import_policy
    DocumentUploadResponse:
      type: object
      properties:
        document_id: *id001
        revision_id: *id001
        job_id: *id001
        upload_status:
          type: string
          enum:
          - saved
      required:
      - document_id
      - revision_id
      - job_id
      - upload_status
  responses:
    Unauthorized:
      description: 未登录或 Token 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 无权访问该空间/路径
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 版本冲突或原件已变化；error.current_document_version 可能返回
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validation:
      description: 字段格式/同空间约束/路径策略不满足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
