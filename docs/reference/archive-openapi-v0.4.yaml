              - all
        metadata:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              operator:
                type: string
                enum:
                - eq
                - in
                - contains
                - gte
                - lte
                - between
                - is_null
              value: *id005
            required:
            - key
            - operator
        source_id: *id001
        source_kind:
          type: string
          enum:
          - managed
          - external
        triage_status:
          type: string
          enum:
          - needs_review
          - filed
        availability_status:
          type: string
        processing_status:
          type: string
        sort:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                enum:
                - relevance
                - imported_at
                - document_date
                - title
                - size_bytes
              order:
                type: string
                enum:
                - asc
                - desc
            required:
            - field
            - order
        page:
          type: integer
