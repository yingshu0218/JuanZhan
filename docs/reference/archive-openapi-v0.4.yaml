        estimated_files: *id004
        estimated_bytes: *id004
        ignored_files: *id004
        by_extension:
          type: object
          additionalProperties: *id004
        warnings:
          type: array
          items:
            type: string
      required:
      - source_id
      - estimated_files
      - estimated_bytes
      - ignored_files
    SearchRequest:
      type: object
      properties:
        space_id: *id001
        text:
          type: string
        folder:
          type: object
          properties:
            id: *id001
            include_descendants: *id002
        document_type_ids:
          type: array
          items: *id001
        tags:
          type: object
          properties:
            ids:
              type: array
              items: *id001
            match:
              type: string
              enum:
